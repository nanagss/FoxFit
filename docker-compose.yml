services:
  db:
    image: postgres:15
    container_name: foxfit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${FOXFIT_DB_PASSWORD:?Defina a variável de ambiente FOXFIT_DB_PASSWORD antes de subir o Docker}"
      POSTGRES_DB: foxfit
    ports:
      - "${FOXFIT_DB_PORT:-5432}:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
