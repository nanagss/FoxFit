services:
  db:
    image: postgres:15
    container_name: foxfit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${FOXFIT_DB_PASSWORD:-190207}"
      POSTGRES_DB: foxfit
    ports:
      - "${FOXFIT_DB_PORT:-5432}:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foxfit"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: foxfit_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FOXFIT_HOST: "0.0.0.0"
      FOXFIT_PORT: "8080"
      FOXFIT_DB_HOST: "db"
      FOXFIT_DB_PORT: "5432"
      FOXFIT_DB_NAME: "foxfit"
      FOXFIT_DB_PASSWORD: "${FOXFIT_DB_PASSWORD:-190207}"
    ports:
      - "${FOXFIT_APP_PORT:-8080}:8080"

volumes:
  postgres_data:
    driver: local
